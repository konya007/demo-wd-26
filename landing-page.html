<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tiêu đề, mô tả, favicon, màu, font: core.js điền từ bộ dữ liệu thương hiệu -->
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/effects.css">
  <script src="js/core.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js" defer></script>
  <script src="wd2026.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="landing">
  <a class="skip" href="#main">Bỏ qua menu</a>
  <wl-scroll-progress></wl-scroll-progress>
  <wl-header></wl-header>

  <main id="main">
    <!-- Landing chiến dịch: nội dung trong data.landing của từng thương hiệu.
         Hành trình: thông điệp + hạn chót → điểm nổi bật → câu chuyện → lịch trình
         → chọn gói (điền sẵn form) → giải đáp → kêu gọi lần cuối. -->
    <wl-landing-hero></wl-landing-hero>
    <wl-landing-highlights></wl-landing-highlights>
    <wl-landing-story></wl-landing-story>
    <wl-landing-agenda></wl-landing-agenda>
    <wl-landing-offer></wl-landing-offer>
    <wl-faq source="landing.faq" copy="landingFaq"></wl-faq>
    <wl-cta-band copy="landingCta"></wl-cta-band>
  </main>

  <wl-footer></wl-footer>
  <wl-brand-switcher></wl-brand-switcher>
  <wl-back-to-top></wl-back-to-top>
  <wl-sticky-cta></wl-sticky-cta>
</body>
</html>
