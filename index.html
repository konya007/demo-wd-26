<!DOCTYPE html>
<html lang="vi" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO (updated by JS) -->
    <title>Aurora Studio</title>
    <meta name="description" content="Aurora Studio — Digital Creative Agency">
    <link rel="icon" href="https://placehold.co/64x64/2563EB/FFFFFF?text=A">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Be Vietnam Pro"', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="font-body bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased transition-colors duration-300">

    <!-- ========== NAVBAR ========== -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-white/80 dark:bg-gray-950/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 lg:h-20">
                <a href="#/" class="flex items-center gap-2 nav-brand">
                    <img id="navLogo" src="https://placehold.co/40x40/2563EB/FFFFFF?text=A" alt="Logo" class="h-8 w-auto rounded-lg">
                    <span id="navBrand" class="font-display font-bold text-xl text-gray-900 dark:text-white">Aurora</span>
                </a>

                <div class="hidden lg:flex items-center gap-1">
                    <a href="#/" class="nav-link px-3 py-2 text-sm font-medium rounded-lg text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-all">Trang chủ</a>
                    <a href="#/projects" class="nav-link px-3 py-2 text-sm font-medium rounded-lg text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-all">Dự án</a>
                    <a href="#/about" class="nav-link px-3 py-2 text-sm font-medium rounded-lg text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-all">Về chúng tôi</a>
                    <a href="#/achievements" class="nav-link px-3 py-2 text-sm font-medium rounded-lg text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-all">Thành tích</a>
                    <a href="#/contact" class="nav-link px-3 py-2 text-sm font-medium rounded-lg text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-all">Liên hệ</a>
                </div>

                <div class="flex items-center gap-2">
                    <button id="themeToggle" class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-all" aria-label="Toggle theme">
                        <i data-lucide="sun" class="w-5 h-5 text-gray-600 dark:text-gray-400 hidden dark:block"></i>
                        <i data-lucide="moon" class="w-5 h-5 text-gray-600 dark:text-gray-400 block dark:hidden"></i>
                    </button>

                    <button id="mobileMenuBtn" class="lg:hidden p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" aria-label="Menu">
                        <i data-lucide="menu" class="w-6 h-6 text-gray-600 dark:text-gray-400"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobileMenu" class="lg:hidden hidden bg-white dark:bg-gray-950 border-t border-gray-100 dark:border-gray-800 shadow-lg">
            <div class="px-4 py-4 space-y-1">
                <a href="#/" class="mobile-nav-link block text-sm font-medium text-gray-600 dark:text-gray-400 py-2.5 px-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-900">Trang chủ</a>
                <a href="#/projects" class="mobile-nav-link block text-sm font-medium text-gray-600 dark:text-gray-400 py-2.5 px-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-900">Dự án</a>
                <a href="#/about" class="mobile-nav-link block text-sm font-medium text-gray-600 dark:text-gray-400 py-2.5 px-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-900">Về chúng tôi</a>
                <a href="#/achievements" class="mobile-nav-link block text-sm font-medium text-gray-600 dark:text-gray-400 py-2.5 px-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-900">Thành tích</a>
                <a href="#/contact" class="mobile-nav-link block text-sm font-medium text-gray-600 dark:text-gray-400 py-2.5 px-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-900">Liên hệ</a>
            </div>
        </div>
    </nav>

    <!-- ========== MAIN CONTENT ========== -->
    <main id="app" class="min-h-screen">
        <!-- Pages rendered by router -->
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="bg-gray-900 dark:bg-gray-900 text-gray-400 py-12 border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex items-center gap-3">
                    <img id="footerLogo" src="https://placehold.co/40x40/FFFFFF/111827?text=A" alt="Logo" class="h-8 w-auto rounded-lg">
                    <span id="footerBrand" class="font-display font-bold text-lg text-white">Aurora Studio</span>
                </div>
                <p id="footerTagline" class="text-sm text-center md:text-right text-gray-500">
                    Thiết kế số cho thương hiệu dám khác biệt
                </p>
            </div>
            <div class="border-t border-gray-800 mt-8 pt-8 text-center text-sm">
                <p id="footerCopyright">&copy; 2024 Aurora Studio. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- ========== SCRIPTS ========== -->
    <script src="./wd2026.js"></script>
    <script src="./main.js"></script>
    <script>
        WebDesign2026.init({
            folder: 'assets-web-design',
            files: ['data-1.json', 'data-2.json', 'data-3.json'],
            labels: ['Data 1', 'Data 2', 'Data 3'],
            defaultIndex: 0,
            overrideCss: true,
        });
    </script>
</body>

</html>
